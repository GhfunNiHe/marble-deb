name: Build Ubuntu RootFS

on:
  workflow_dispatch:
    inputs:
      distro_suite:
        description: 'Ubuntu 版本 / Ubuntu version'
        type: choice
        options:
          - noble
          - resolute
          - stonking
        default: 'noble'

      desktop:
        description: '桌面环境（server = 无桌面） / Desktop environment (server = no DE)'
        type: choice
        options:
          - Phosh
          - KDE Plasma Mobile
          - KDE Plasma
          - GNOME
          - server
        default: 'KDE Plasma'

      autologin:
        description: '自动登录 / Autologin'
        type: boolean
        default: true

      username:
        description: '用户名 / Username'
        type: string
        default: 'Redmi'

      hostname:
        description: '主机名 / Hostname'
        type: string
        default: 'marble-ubuntu'

      language:
        description: '系统语言 / System language'
        type: choice
        options:
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_CN.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
        default: 'None (C.UTF-8)'

      image_size:
        description: 'rootfs.img 大小（首次启动时扩展到实际分区） / rootfs.img size (grown to the real partition on first boot)'
        type: string
        default: '10G'

      esp_size:
        description: 'esp.img 大小（须适配 ESP 分区；marble P34 = 128M） / esp.img size (must fit the ESP partition; marble P34 = 128M)'
        type: string
        default: '128M'

      root_partition:
        description: 'rootfs 启动所用的 GPT 分区标签（写入 fstab 与 extlinux.conf） / Rootfs boot partition label (fstab + extlinux.conf)'
        type: string
        default: 'linux'

      deb_repo:
        description: '发布设备 .deb 的仓库 / Repository that publishes the device .debs'
        type: string
        default: 'GhfunNiHe/marble-deb-packages'

      deb_release:
        description: '拉取 .deb 的 Release 标签（"latest" = 最新版本） / Release tag to pull .debs from ("latest" = newest release)'
        type: string
        default: 'latest'

      extra_deb_urls:
        description: '额外 .deb 链接，每行一个（可选） / Extra .deb URLs, one per line (optional)'
        type: string
        default: ''

      publish_release:
        description: '构建后发布 GitHub Release / Publish a GitHub Release after the build'
        type: boolean
        default: true

      extra_packages:
        description: '追加到基础包集的额外软件包，空格分隔（可选） / Extra packages appended to the base set (optional, space separated)'
        type: string
        default: ''

  workflow_call:
    inputs:
      distro_suite:
        description: 'Ubuntu version'
        type: string
        default: 'noble'
      desktop:
        description: 'Desktop environment'
        type: string
        default: 'KDE Plasma'
      autologin:
        description: 'Autologin'
        type: boolean
        default: true
      username:
        description: 'Username'
        type: string
        default: 'Redmi'
      hostname:
        description: 'Hostname'
        type: string
        default: 'marble-ubuntu'
      language:
        description: 'System language'
        type: string
        default: 'None (C.UTF-8)'
      image_size:
        description: 'rootfs.img size'
        type: string
        default: '10G'
      esp_size:
        description: 'esp.img size'
        type: string
        default: '128M'
      root_partition:
        description: 'Rootfs partition label'
        type: string
        default: 'linux'
      deb_repo:
        description: 'Device .deb repository'
        type: string
        default: 'GhfunNiHe/marble-deb-packages'
      deb_release:
        description: 'Device .deb release tag'
        type: string
        default: 'latest'
      extra_deb_urls:
        description: 'Extra .deb URLs'
        type: string
        default: ''
      publish_release:
        description: 'Publish a per-image release'
        type: boolean
        default: false
      extra_packages:
        description: 'Extra packages'
        type: string
        default: ''
    secrets:
      ROOTFS_PASSWORD:
        description: 'RootFS password; empty falls back to the workflow default'
        required: false

jobs:
  build-rootfs:
    permissions:
      contents: read
    uses: ./.github/workflows/assemble-ubuntu.yml
    with:
      distro_suite: ${{ inputs.distro_suite }}
      desktop: ${{ inputs.desktop }}
      autologin: ${{ inputs.autologin }}
      username: ${{ inputs.username }}
      hostname: ${{ inputs.hostname }}
      language: ${{ inputs.language }}
      image_size: ${{ inputs.image_size }}
      esp_size: ${{ inputs.esp_size }}
      root_partition: ${{ inputs.root_partition }}
      deb_repo: ${{ inputs.deb_repo }}
      deb_release: ${{ inputs.deb_release }}
      extra_deb_urls: ${{ inputs.extra_deb_urls }}
      extra_packages: ${{ inputs.extra_packages }}
    secrets:
      ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}

  release:
    name: "Publish Release"
    needs: build-rootfs
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: "Resolve Release Metadata"
        env:
          SUITE: ${{ inputs.distro_suite }}
          DESKTOP: ${{ inputs.desktop }}
        run: |
          slug=$(printf '%s' "$DESKTOP" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/-$//')
          stamp=$(date -u +%Y%m%d-%H%M)
          echo "TAG=ubuntu-${SUITE}-${slug}-${stamp}" >> "$GITHUB_ENV"
          echo "TITLE=Ubuntu ${SUITE} · ${DESKTOP} (${stamp:0:4}-${stamp:4:2}-${stamp:6:2} ${stamp:9:2}:${stamp:11:2} UTC)" >> "$GITHUB_ENV"

      - name: "Download Artifacts"
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: "Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body: |
            - System: Ubuntu `${{ inputs.distro_suite }}`
            - Desktop: `${{ inputs.desktop }}`
            - Hostname: `${{ inputs.hostname }}`
            - User: `${{ inputs.username }}`
            - Image size: `${{ inputs.image_size }}`

            Android sparse images for Xiaomi marble. `rootfs` is split into 2 GiB 7z volumes.
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
