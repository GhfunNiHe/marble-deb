name: Build All Desktop RootFS

# Builds every supported desktop for every supported suite as one run:
#   Debian trixie/forky/sid + Ubuntu noble/resolute/stonking
#   x Phosh / KDE Plasma Mobile / KDE Plasma / GNOME
#
# After all 24 builds succeed, publish their assets in a single GitHub
# pre-release in this repository. No secrets are passed to the
# called workflows, so ROOTFS_PASSWORD stays empty and the image password
# remains the existing default "password".

on:
  workflow_dispatch:
    inputs:
      deb_repo:
        description: '发布设备 .deb 的仓库 / Repository that publishes the device .debs'
        type: string
        default: 'GhfunNiHe/marble-deb-packages'
      deb_release:
        description: '设备 .deb 的 Release 标签 / Device .deb release tag'
        type: string
        default: 'apt'
      username:
        description: '用户名 / Username'
        type: string
        default: 'Redmi'
      language:
        description: '系统语言 / System language'
        type: choice
        options:
          - 'None (C.UTF-8)'
          - 'en_US.UTF-8'
          - 'zh_CN.UTF-8'
          - 'zh_TW.UTF-8'
          - 'ja_JP.UTF-8'
          - 'ko_KR.UTF-8'
          - 'de_DE.UTF-8'
          - 'fr_FR.UTF-8'
          - 'es_ES.UTF-8'
          - 'ru_RU.UTF-8'
        default: 'None (C.UTF-8)'
      image_size:
        description: 'rootfs.img 大小 / rootfs.img size'
        type: string
        default: '10G'
      esp_size:
        description: 'esp.img 大小 / esp.img size'
        type: string
        default: '128M'
      publish_release:
        description: '全部成功后发布 GitHub Pre-Release'
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: all-desktops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-debs:
    name: Download device DEBs
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Download device DEBs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          RELEASE="${{ inputs.deb_release }}"
          if [ "$RELEASE" = latest ]; then
            RELEASE=apt
          fi
          gh release download "$RELEASE" --repo "${{ inputs.deb_repo }}" --pattern '*.deb' --dir debs --clobber
          ls -lh debs
      - name: "Upload device DEB artifact"
        uses: actions/upload-artifact@v7
        with:
          name: device-debs
          path: debs/*.deb
          if-no-files-found: error

  build-deps:
    name: Dependencies ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - trixie
          - noble
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Build dependency DEBs"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev \
            bash-completion gobject-introspection gtk-doc-tools help2man \
            libglib2.0-dev libgirepository1.0-dev meson ninja-build pkgconf \
            dh-exec gnome-pkg-tools doxygen liblua5.4-dev libpipewire-0.3-dev \
            libspa-0.2-dev libsystemd-dev systemd-dev dbus python3-lxml

          mkdir -p deps
          build_src() {
            name="$1"; shift
            builddir=$(mktemp -d "$RUNNER_TEMP/$name.XXXXXXXX")
            (
              cd "$builddir"
              for url in "$@"; do
                curl -fsSLO "$url"
              done
              dsc=$(find . -maxdepth 1 -name '*.dsc' -print -quit)
              dpkg-source -x "$dsc" src
              cd src
              DEB_BUILD_PROFILES=nodoc DEB_BUILD_OPTIONS=nocheck \
                dpkg-buildpackage -b -us -uc -d
            )
            cp "$builddir"/*.deb deps/
            rm -rf "$builddir"
          }

          if [ "${{ matrix.suite }}" = noble ]; then
            build_src libmbim \
              https://deb.debian.org/debian/pool/main/libm/libmbim/libmbim_1.32.0-1.dsc \
              https://deb.debian.org/debian/pool/main/libm/libmbim/libmbim_1.32.0.orig.tar.xz \
              https://deb.debian.org/debian/pool/main/libm/libmbim/libmbim_1.32.0-1.debian.tar.xz
          fi
          build_src wireplumber \
            https://deb.debian.org/debian/pool/main/w/wireplumber/wireplumber_0.5.12-1~bpo13+1.dsc \
            https://deb.debian.org/debian/pool/main/w/wireplumber/wireplumber_0.5.12.orig.tar.bz2 \
            https://deb.debian.org/debian/pool/main/w/wireplumber/wireplumber_0.5.12-1~bpo13+1.debian.tar.xz
          ls -lh deps/

      - name: "Upload dependency DEBs"
        uses: actions/upload-artifact@v7
        with:
          name: suite-deps-${{ matrix.suite }}
          path: deps/*.deb
          if-no-files-found: error

  build-debian:
    name: Build
    needs:
      - build-deps
      - download-debs
    strategy:
      fail-fast: false
      matrix:
        suite:
          - trixie
          - forky
          - sid
        desktop:
          - 'Phosh'
          - 'KDE Plasma Mobile'
          - 'KDE Plasma'
          - 'GNOME'
    uses: ./.github/workflows/assemble-debian.yml
    with:
      distro_suite: ${{ matrix.suite }}
      desktop: ${{ matrix.desktop }}
      autologin: true
      username: ${{ inputs.username }}
      hostname: marble-debian
      language: ${{ inputs.language }}
      image_size: ${{ inputs.image_size }}
      esp_size: ${{ inputs.esp_size }}
      upload_esp: ${{ matrix.suite == 'trixie' && matrix.desktop == 'Phosh' }}
      root_partition: linux
      deb_repo: ${{ inputs.deb_repo }}
      deb_release: ${{ inputs.deb_release }}
      extra_deb_urls: ''
      extra_packages: ''
      deps_artifact: ${{ matrix.suite == 'trixie' && 'suite-deps-trixie' || '' }}
      debs_artifact: device-debs

  build-ubuntu:
    name: Build
    needs:
      - build-deps
      - download-debs
    strategy:
      fail-fast: false
      matrix:
        suite:
          - noble
          - resolute
          - stonking
        desktop:
          - 'Phosh'
          - 'KDE Plasma Mobile'
          - 'KDE Plasma'
          - 'GNOME'
    uses: ./.github/workflows/assemble-ubuntu.yml
    with:
      distro_suite: ${{ matrix.suite }}
      desktop: ${{ matrix.desktop }}
      autologin: true
      username: ${{ inputs.username }}
      hostname: marble-ubuntu
      language: ${{ inputs.language }}
      image_size: ${{ inputs.image_size }}
      esp_size: ${{ inputs.esp_size }}
      upload_esp: false
      root_partition: linux
      deb_repo: ${{ inputs.deb_repo }}
      deb_release: ${{ inputs.deb_release }}
      extra_deb_urls: ''
      extra_packages: ''
      deps_artifact: ${{ matrix.suite == 'noble' && 'suite-deps-noble' || '' }}
      debs_artifact: device-debs

  publish:
    name: Publish Pre-Release
    needs:
      - build-debian
      - build-ubuntu
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write

    steps:
      - name: "Download all build artifacts"
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: "Rename assets and generate checksums"
        run: |
          mkdir -p release
          mv -- artifacts/esp-trixie-Phosh/esp.simg.xz release/esp.simg.xz
          for dir in artifacts/rootfs-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/-$//')
            for f in "$dir"/*; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              [ "$base" = "SHA256SUMS" ] && continue
              mv -- "$f" "release/${slug}-${base}"
            done
          done
          [ -s release/esp.simg.xz ] \
            || { echo "::error::no ESP images collected"; exit 1; }
          [ -n "$(find release -maxdepth 1 -type f -name '*.7z.*' -print -quit)" ] \
            || { echo "::error::no rootfs volumes collected"; exit 1; }
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: "Create Pre-Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marble-all-desktops-${{ github.run_id }}
          name: Marble full-desktop RootFS pre-release (${{ github.run_id }})
          prerelease: true
          body: |
            Full desktop matrix for Xiaomi marble.
            This is an automated pre-release.

            - Debian: `trixie`, `forky`, `sid`
            - Ubuntu: `noble`, `resolute`, `stonking`
            - Desktops: `Phosh`, `KDE Plasma Mobile`, `KDE Plasma`, `GNOME`
            - Default user password: `password`

            `rootfs` assets are split 7z volumes; `esp.simg.xz` is shared by all systems and desktops.
            Flash with `fastboot flash esp esp.simg` after xz decompression,
            and `fastboot flash linux <rootfs>.simg` after 7z extraction.
          files: release/*
          preserve_order: true
          fail_on_unmatched_files: true
          overwrite_files: false

